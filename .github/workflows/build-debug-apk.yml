name: Build Debug APK

on:
  push:
    branches: [ kmping ]
  pull_request:
    branches: [ kmping ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create local.properties
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        echo "MAPS_API_KEY=CI_PLACEHOLDER" >> local.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Print Signing SHA1
      run: |
        echo "=== Build-time Signing SHA1 (Debug Certificate) ==="
        echo "Expected from AmapDiagnostics.kt:"
        grep -A 3 'EXPECTED_DEBUG_SHA1' shared/src/androidMain/kotlin/com/sdevprem/runtrack/shared/diagnostics/AmapDiagnostics.kt || echo "SHA1 constant not found"
        echo ""
        echo "Computed from debug keystore:"
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          echo "Generating debug keystore..."
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt 2>/dev/null || true
        fi
        keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
          -storepass android 2>/dev/null | grep -E "(SHA1|SHA-1|Alias name):" || echo "SHA1 computation failed (check Android SDK setup)"
        echo "=== End of SHA1 info ==="
        echo ""

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
